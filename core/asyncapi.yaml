# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Worktree an agent moved into or out of
        - $ref: '#/components/schemas/AgentWorktreeChanged'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Visits (a character sent somewhere through the Pixel Office MCP)
        - $ref: '#/components/schemas/AgentVisit'
        # Message show (an agent messaged others through the Pixel Office MCP)
        - $ref: '#/components/schemas/AgentMessageShow'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        - $ref: '#/components/schemas/AgentLayoutEditStatus'
        - $ref: '#/components/schemas/AgentCharacterEditStatus'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterProfilesLoaded'
        - $ref: '#/components/schemas/RecentCharactersLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/OfficeAccess'
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/BypassPermissionsUpdated'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        # Pixel Office MCP (consent + settings)
        - $ref: '#/components/schemas/OfficeMcpConsentRequest'
        - $ref: '#/components/schemas/OfficeMcpStatus'
        # The tutorial (the Guide's hands-on tour, on top of the Pixel Office MCP)
        - $ref: '#/components/schemas/TutorialStatus'
        - $ref: '#/components/schemas/TutorialRejected'
        # Usage bars (the account's plan limits)
        - $ref: '#/components/schemas/UsageBridgeStatus'
        - $ref: '#/components/schemas/UsageLimits'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/CardOrderLoaded'
        - $ref: '#/components/schemas/DirectoriesLoaded'
        - $ref: '#/components/schemas/DirectorySaved'
        - $ref: '#/components/schemas/DirectoryRejected'
        - $ref: '#/components/schemas/DirectorySuggestions'
        - $ref: '#/components/schemas/ConversationsLoaded'
        - $ref: '#/components/schemas/ConversationSearchResults'
        # Worktrees
        - $ref: '#/components/schemas/WorktreeRejected'
        - $ref: '#/components/schemas/WorktreeOptions'
        - $ref: '#/components/schemas/WorktreeDecisionRejected'
        - $ref: '#/components/schemas/AgentCloseQuestion'
        - $ref: '#/components/schemas/WorktreesLoaded'
        # Terminal (standalone embedded terminal control plane)
        - $ref: '#/components/schemas/TerminalAvailability'
        - $ref: '#/components/schemas/TerminalSessionOpened'
        - $ref: '#/components/schemas/TerminalSessionClosed'
        # PC shells (a PC's plain login shell on the host: not an agent)
        - $ref: '#/components/schemas/PcShellsLoaded'
        - $ref: '#/components/schemas/PcShellReady'
        - $ref: '#/components/schemas/PcShellCloseQuestion'
        - $ref: '#/components/schemas/PcShellRejected'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/LayoutEditing'
        - $ref: '#/components/schemas/UndoAgentLayoutEdit'
        - $ref: '#/components/schemas/SaveCharacterProfiles'
        - $ref: '#/components/schemas/CharactersEditing'
        - $ref: '#/components/schemas/UndoAgentCharacterEdit'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetUsageBridgeEnabled'
        - $ref: '#/components/schemas/OfficeMcpConsentResponse'
        - $ref: '#/components/schemas/SetOfficeMcpEnabled'
        - $ref: '#/components/schemas/SetOfficeMcpReadOnly'
        - $ref: '#/components/schemas/StartTutorial'
        - $ref: '#/components/schemas/SkipTutorialQuest'
        - $ref: '#/components/schemas/QuitTutorial'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/ExportFile'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SaveCardOrder'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/SetBypassPermissions'
        - $ref: '#/components/schemas/SetShowHostDirectories'
        - $ref: '#/components/schemas/SetUploadDirectory'
        - $ref: '#/components/schemas/SaveDirectory'
        - $ref: '#/components/schemas/RemoveDirectory'
        - $ref: '#/components/schemas/RequestDirectorySuggestions'
        - $ref: '#/components/schemas/RequestConversations'
        - $ref: '#/components/schemas/SearchConversations'
        - $ref: '#/components/schemas/ResumeConversation'
        - $ref: '#/components/schemas/RequestWorktrees'
        - $ref: '#/components/schemas/RequestWorktreeOptions'
        - $ref: '#/components/schemas/DecideWorktree'
        - $ref: '#/components/schemas/OpenPcShell'
        - $ref: '#/components/schemas/ClosePcShell'
        - $ref: '#/components/schemas/RequestDiagnostics'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        directoryName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        repeat:
          type: integer
          description: Server-assigned copy of its character the agent is (0 = the character as drawn, n = its nth repeat, which the office draws with its clothes in the nth repeat colour).
        seatId:
          type: string
          description: >-
            The seat the agent should take when it is free (a resumed
            conversation's agent returns to where it sat). Absent, the office
            picks one.
        worktree:
          $ref: '#/components/schemas/AgentWorktree'
        nickname:
          type: string
          description: >-
            The Nickname the agent was launched with (Pixel Office MCP
            launch_agent): shown after its Directory on its card and label.
            Only a label: it never makes the agent a Teammate.

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, directoryNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        directoryNames:
          type: object
          description: Map of agent ID (string) to Directory name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean
        worktrees:
          type: object
          description: >-
            Map of agent ID (string) to the Worktree it runs in, for the
            agents that run in one (a Teammate wears its Lead's). Absent or
            missing an id = that agent runs in its Directory's own checkout.
          additionalProperties:
            $ref: '#/components/schemas/AgentWorktree'
        nicknames:
          type: object
          description: >-
            Map of agent ID (string) to the Nickname it was launched with, for
            the agents launched with one.
          additionalProperties:
            type: string

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentWorktreeChanged:
      description: |
        A running agent moved into or out of a Worktree mid-session (a move
        the CLI makes, Claude Code's EnterWorktree / ExitWorktree, or a
        background session's own): the same agent, now in `worktree`, or in its
        Directory's own checkout (or somewhere else) when absent. Only a
        folder under the Directory's worktrees folder (Claude Code:
        `.claude/worktrees/`) is a Worktree; the agent keeps its
        Directory, name and look. Its sub-agents wear the same marker.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentWorktreeChanged
        id:
          type: integer
        worktree:
          $ref: '#/components/schemas/AgentWorktree'

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    AgentVisit:
      description: |
        An agent's character is on a Visit (CONTEXT.md): it walks to `to`,
        faces `facing`, and lingers a while before wandering as usual — or,
        with `stay`, holds there until its agent's next turn. `cleared: true`
        (and nothing else) ends the visit: the agent's next turn started, so
        its character goes back to its seat. The server resolved and checked
        the tile, and re-sends every agent's current visit (or `cleared`) in
        the connect snapshot, so every office shows the same visits.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentVisit
        id:
          type: integer
        to:
          $ref: '#/components/schemas/TilePosition'
        facing:
          $ref: '#/components/schemas/Facing'
        stay:
          type: boolean
        cleared:
          type: boolean

    AgentMessageShow:
      description: |
        Agent `fromId` messaged the agents `toIds` (delivered, in order)
        through the Pixel Office MCP, saying `gist` (one line, at most 80
        characters). Each office shows it: the sender's character walks to
        a tile beside each recipient's character in turn, faces it with the
        gist in its speech bubble, then goes back to its desk. Only offices
        open at the time show it — it is not part of the connect snapshot —
        and delivery never waits for it.
      type: object
      additionalProperties: false
      required: [type, fromId, toIds, gist]
      properties:
        type:
          const: agentMessageShow
        fromId:
          type: integer
        toIds:
          type: array
          items:
            type: integer
        gist:
          type: string

    TilePosition:
      description: A tile of the office grid (column and row, from the top left).
      type: object
      additionalProperties: false
      required: [col, row]
      properties:
        col:
          type: integer
        row:
          type: integer

    Facing:
      description: The way a character faces.
      type: string
      enum: [up, down, left, right]

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout. `buildout` is set only on the
        broadcast of a Pixel Office MCP agent's layout edit (never an undo, a
        person's save, or the connect snapshot): offices open at the time play
        the Buildout (CONTEXT.md) from it. `shift` is how far the change
        moved the grid's existing tiles (a resize growing or cutting the
        left/top edge: an agent's edit, or the undo of one), so characters
        and pets move with them; absent = not at all.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean
        buildout:
          $ref: '#/components/schemas/LayoutBuildout'
        shift:
          $ref: '#/components/schemas/GridShift'

    LayoutBuildout:
      description: |
        An agent's layout edit, to be built into the office: agent `agentId`
        made it, and it grows outward from `origin` (the first tile the edit
        names, in the new grid; the old layout lines up with it by the
        message's `shift`). An edit that names no tile (a resize alone, a pet, a new Area) carries
        no buildout and simply appears.
      type: object
      additionalProperties: false
      required: [agentId, origin]
      properties:
        agentId:
          type: integer
        origin:
          $ref: '#/components/schemas/TilePosition'

    GridShift:
      description: How far a resize moved the grid's existing tiles (columns right, rows down; negative = left/up).
      type: object
      additionalProperties: false
      required: [col, row]
      properties:
        col:
          type: integer
        row:
          type: integer

    AgentLayoutEditStatus:
      description: |
        What the layout editor's "Undo <agent>'s edit" would revert: the newest
        Pixel Office MCP layout edit, while the office still holds exactly what
        it wrote (`agentId` + `agentName`); neither = nothing to undo. Broadcast
        whenever that changes and sent on connect. Sent to one office alone with
        `refused` when its `undoAgentLayoutEdit` was refused (the reason).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: agentLayoutEditStatus
        agentId:
          type: integer
        agentName:
          type: string
        refused:
          type: string

    AgentCharacterEditStatus:
      description: |
        What the Characters view's "Undo <agent>'s edit" would revert: the newest
        Pixel Office MCP Character edit, while the roster and the Directories it
        touched still hold exactly what it wrote (`agentId` + `agentName`, and
        `summary`: what it did, in a few words — "created Naruto"); none of them =
        nothing to undo. Broadcast whenever that changes and sent on connect;
        `landed` on the broadcast sent as the edit lands (the view's status line
        names the agent then). Sent to one office alone with `refused` when its
        `undoAgentCharacterEdit` was refused (the reason).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: agentCharacterEditStatus
        agentId:
          type: integer
        agentName:
          type: string
        summary:
          type: string
        landed:
          type: boolean
        refused:
          type: string

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterProfilesLoaded:
      description: |
        The character profiles agents are drawn from (~/.pixel-agents/characters.json, or
        the six defaults). Profile N is palette N. Sent after webviewReady before
        characterSpritesLoaded, again when another process rewrites characters.json, and
        as the answer to every saveCharacterProfiles (see saveId).
      type: object
      additionalProperties: false
      required: [type, profiles]
      properties:
        type:
          const: characterProfilesLoaded
        profiles:
          type: array
          description: |
            The saved profiles, exactly as persisted. A valid current-format save comes
            back byte-identical (JSON.stringify of the sent list equals that of this one).
          items:
            $ref: '#/components/schemas/CharacterProfile'
        agentLooks:
          type: array
          description: |
            The agents whose look this list changed: their characters moved to other indices
            (a character inserted or deleted before them), or theirs was deleted and they
            got a new one. Apply together with the list, so no frame draws an agent from the
            wrong character. Absent when no agent's look changed.
          items:
            $ref: '#/components/schemas/AgentLook'
        saveId:
          type: string
          description: |
            Present only when this message answers a saveCharacterProfiles: the saveId that
            save carried. A save that persisted is broadcast to every client with its
            saveId; a save that was refused (invalid list, failed write) is answered to the
            sender alone, with the profiles still on disk and the refused save's saveId.
            Absent on the initial load and on reloads after an external file change.
        items:
          type: array
          description: |
            The custom wardrobe items (~/.pixel-agents/wardrobe-items.json): parts the
            user saved from the pixel editor, wearable by every character. Always sent by
            this server; absent from an older one.
          items:
            $ref: '#/components/schemas/WardrobeItem'

    CharacterSpritesLoaded:
      description: |
        Pre-colored character sprite sets from external asset directories (char_N.png),
        worn by the palettes after the character profiles. Possibly empty; sent once at
        startup and again when the directories change.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - hooksEnabled
        - externalAssetDirectories
        - showAreas
        - bypassPermissions
        - showHostDirectories
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        hooksEnabled:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean
        bypassPermissions:
          type: boolean
          description: >-
            Persistent per-host permission posture. While true, every launch on
            this host runs the CLI with its skip-permissions flag.
        showHostDirectories:
          type: boolean
          description: >-
            Persistent per-host choice whether the host's own Directories (VS
            Code's workspace folders, standalone's start directory) are listed
            in `directoriesLoaded`. Off by default.
        uploadDirectory:
          type: string
          description: >-
            Where files sent to a terminal are saved on the host, as an absolute
            path: the user's choice, else the server's own uploads folder.
            Sent by hosts with a terminal (standalone).

    BypassPermissionsUpdated:
      description: |
        The host's skip-permissions posture changed (an accepted
        `setBypassPermissions`). Broadcast to every connected office, the one
        that sent it included, so every Settings toggle shows the posture the
        next launch will actually use. `enabled` is the persisted value read
        back after the write, not an echo of the request.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: bypassPermissionsUpdated
        enabled:
          type: boolean

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    UsageBridgeStatus:
      description: |
        Whether the provider's usage bridge is installed — the script that
        reports the account's plan usage (Claude: a wrapper around the user's
        status line in ~/.claude/settings.json). Install state, never intent:
        sent on connect, and after every `setUsageBridgeEnabled` with the
        outcome. Privileged connections only, like `usageLimits`.
      type: object
      additionalProperties: false
      required: [type, providerId, providerName, installed, summary, disclosure]
      properties:
        type:
          const: usageBridgeStatus
        providerId:
          type: string
          description: The provider this is about (HookProvider.id).
        providerName:
          type: string
          description: Its name for people (HookProvider.displayName), whose plan the bars show.
        installed:
          type: boolean
        summary:
          type: string
          description: One line beside the Intro's checkbox.
        disclosure:
          type: string
          description: >-
            What installing writes, what data moves and how to undo it — the
            provider's own copy, shown before the user confirms (paragraphs
            split on blank lines).
        error:
          type: string
          description: Why the last change failed (sent to the asker only).

    UsageLimits:
      description: |
        The account's plan usage, as the provider's usage bridge last reported
        it: sent on connect and whenever a report moves the numbers (or the
        last one is a minute old). Reports only arrive while a CLI session is
        open, so `updatedAt` says how fresh the numbers are; a window past its
        `resetsAt` has reset since. No windows = nothing reported yet.
        Privileged connections only: it is the operator's account data.
      type: object
      additionalProperties: false
      required: [type, providerId]
      properties:
        type:
          const: usageLimits
        providerId:
          type: string
        fiveHour:
          $ref: '#/components/schemas/UsageWindow'
        sevenDay:
          $ref: '#/components/schemas/UsageWindow'
        updatedAt:
          type: number
          description: When the last report arrived (epoch milliseconds).

    OfficeMcpConsentState:
      description: The Pixel Office MCP consent as recorded (absent in config.json = unanswered).
      type: string
      enum: [unanswered, granted, declined]

    OfficeMcpConsentRequest:
      description: |
        Ask this client the Intro's Pixel Office MCP step: may the agents this
        office launches use the Pixel Agents Office MCP? Sent during the
        `webviewReady` handshake, after the hooks asks, while the answer is
        unrecorded — on privileged connections of a server that offers the
        MCP only. Carries the server's own copy, rendered verbatim. Answered
        with `officeMcpConsentResponse`; dismissing sends nothing and the ask
        returns on the next connect.
      type: object
      additionalProperties: false
      required: [type, headline, summary, disclosure]
      properties:
        type:
          const: officeMcpConsentRequest
        headline:
          type: string
        summary:
          type: string
          description: One line beside the Intro's checkbox; the full terms are `disclosure`, behind its "Read more".
        disclosure:
          type: string
          description: What agents could do through it (paragraphs split on blank lines).

    OfficeMcpStatus:
      description: |
        The Pixel Office MCP's settings as recorded: the consent answer
        (`unanswered` until one is given; `granted` = launches and resumes get
        the MCP, `declined` = they don't) and whether it is read-only (agents
        may list and read, nothing else). Sent on connect and broadcast after
        every change, privileged connections of a server that offers the MCP
        only. Carries the disclosure the Settings switch confirms with.
      type: object
      additionalProperties: false
      required: [type, consent, readOnly, headline, disclosure]
      properties:
        type:
          const: officeMcpStatus
        consent:
          $ref: '#/components/schemas/OfficeMcpConsentState'
        readOnly:
          type: boolean
        headline:
          type: string
        disclosure:
          type: string

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed — and, in standalone, only
        on privileged (tokened) connections, since an untokened spectator could not
        act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, summary, disclosure, cliInstalled]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        summary:
          type: string
          description: One line beside the Intro's checkbox; the full terms are `disclosure`, behind its "Read more".
        cliInstalled:
          type: boolean
          description: Whether the provider's CLI was found on this machine; the Intro's "get Claude Code" step shows only when it wasn't.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Directory-to-Area mappings. Directory names map to one or more Area
        labels; new agents from that Directory prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of Directory name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    CardOrderLoaded:
      description: |
        The order of the agent cards, the same on every client: sent on
        `webviewReady`, and broadcast after a `saveCardOrder` so every open
        office (desktop and phone) follows a reorder. Ids of agents that are
        gone are allowed; agents it doesn't list follow in creation order.
      type: object
      additionalProperties: false
      required: [type, order]
      properties:
        type:
          const: cardOrderLoaded
        order:
          type: array
          items:
            type: integer

    RecentCharactersLoaded:
      description: |
        The characters launched most recently, most recent first (indices into
        the character profiles), shared by every office: the launch roster
        lists them first, then the rest in cast order. Sent on `webviewReady`
        and broadcast after every launch that wore a roster pick.
      type: object
      additionalProperties: false
      required: [type, recent]
      properties:
        type:
          const: recentCharactersLoaded
        recent:
          type: array
          items:
            type: integer

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    DirectoriesLoaded:
      description: |
        The Directories agents can be launched into: the union of the user-defined
        entries (machine-wide, shared by every host) and the host's own native
        context, contributed as `source: host` entries — VS Code its workspace
        folders, standalone the directory the server was started from. Deduped by
        path with the user-defined entry winning, and ordered alphabetically by
        name.

        Rebroadcast to every connected office after every Directory mutation
        (`saveDirectory`, `removeDirectory`). A client learns its own delete
        succeeded from this; a save is acked separately by `directorySaved`.
      type: object
      additionalProperties: false
      required: [type, directories]
      properties:
        type:
          const: directoriesLoaded
        directories:
          type: array
          items:
            $ref: '#/components/schemas/Directory'

    DirectorySaved:
      description: |
        A `saveDirectory` was accepted and persisted. Sent point-to-point to the
        requesting client (never broadcast), right after the `directoriesLoaded`
        rebroadcast. Carries the entry exactly as stored: the host resolves the
        path (tilde expansion, absolute resolution) and names an unnamed entry
        after the resolved basename, so `directory.name` can differ from
        anything the client typed. Area mappings are keyed by Directory name,
        so a client assigning Areas in the same save keys them by this name.
      type: object
      additionalProperties: false
      required: [type, directory]
      properties:
        type:
          const: directorySaved
        directory:
          $ref: '#/components/schemas/Directory'

    DirectoryRejected:
      description: |
        A `saveDirectory` failed host-side validation, or a `saveDirectory` /
        `removeDirectory` could not be written to the shared config. Sent
        point-to-point to the requesting client (never broadcast) and nothing
        changed on disk; the Directory modal stays open and shows `reason` inline.
      type: object
      additionalProperties: false
      required: [type, path, reason]
      properties:
        type:
          const: directoryRejected
        path:
          type: string
          description: The path exactly as submitted, before tilde expansion.
        reason:
          type: string
          description: Human-readable cause, shown inline in the Directory modal.

    WorktreeRejected:
      description: |
        A `launchAgent` with `worktree: true` could not create its Worktree (the
        Directory is not a git repo, no free name, git failed): nothing was
        launched and nothing was left on disk. Also the answer to a
        `resumeConversation` of a Worktree's conversation that could not be
        resumed (its branch was deleted, something else sits at its path).
        Sent point-to-point to the client that asked (never broadcast); the
        office shows `reason`.
      type: object
      additionalProperties: false
      required: [type, directoryPath, reason]
      properties:
        type:
          const: worktreeRejected
        directoryPath:
          type: string
          description: The Directory the launch (or the resume) named.
        reason:
          type: string

    WorktreeOptions:
      description: |
        The answer to `requestWorktreeOptions`, to that client only: what the
        new-worktree modal offers. `name` is a fresh generated name (free as a
        folder and, with `prefix`, as a branch); `branches` are the repo's
        local branches and origin's (as last fetched), newest commit first;
        `defaultBase` is the branch the Directory's own base setting points at
        (its current branch, or origin's default branch), absent when its
        checkout is detached and the setting is the current commit. A
        Directory that is no git repo is answered `worktreeRejected` instead.
      type: object
      additionalProperties: false
      required: [type, directoryPath, name, prefix, branches]
      properties:
        type:
          const: worktreeOptions
        directoryPath:
          type: string
        name:
          type: string
          description: A generated Worktree name the user may keep or change.
        prefix:
          type: string
          description: The Directory's branch prefix (the branch is prefix + name).
        branches:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeBranch'
        defaultBase:
          $ref: '#/components/schemas/WorktreeBranch'

    WorktreeBranch:
      description: >-
        A branch a new Worktree can start from: a local one (`refs/heads/`) or
        origin's (`refs/remotes/origin/`), `name` without that prefix.
        `current`: the main checkout's own branch.
      type: object
      additionalProperties: false
      required: [name, location]
      properties:
        name:
          type: string
        location:
          $ref: '#/components/schemas/WorktreeBranchLocation'
        current:
          type: boolean

    WorktreeBranchLocation:
      description: Where a branch lives — `local` (refs/heads) or `origin` (refs/remotes/origin).
      type: string
      enum: [local, origin]

    WorktreeDecisionRejected:
      description: |
        The answer to a `decideWorktree` that could not be carried out (git
        refused the save, more files changed than the user agreed to discard,
        an agent or CLI session still runs in it, it is the CLI's own and
        the choice is not `remove`): the Worktree is left
        as it was. Sent point-to-point to the client that asked; the decision
        dialog (or the Worktrees list) shows `reason`.
      type: object
      additionalProperties: false
      required: [type, directoryPath, name, reason]
      properties:
        type:
          const: worktreeDecisionRejected
        directoryPath:
          type: string
          description: The Directory the decision named.
        name:
          type: string
          description: The Worktree the decision named.
        reason:
          type: string

    AgentCloseQuestion:
      description: |
        The answer to a `closeAgent` (no `worktreeChoice`) for an agent that
        would leave a Worktree of Pixel Agents' with uncommitted files: the
        agent is NOT closed and keeps running, and the client asks the user
        (Commit to branch, Leave as is, Delete changes). The answer comes back as a
        `closeAgent` carrying `worktreeChoice`; dismissing the question
        leaves the agent running. Sent point-to-point to the client that
        pressed close.
      type: object
      additionalProperties: false
      required: [type, id, directoryPath, name, branch, uncommittedFiles]
      properties:
        type:
          const: agentCloseQuestion
        id:
          type: integer
          description: The agent that was asked to close.
        directoryPath:
          type: string
          description: The Directory the Worktree belongs to, as the office lists it.
        name:
          type: string
          description: >-
            The Worktree's name (its folder in the worktrees folder,
            `.claude/worktrees/` for Claude Code).
        branch:
          type: string
        uncommittedFiles:
          type: integer
          minimum: 0
          description: How many files are uncommitted now.

    WorktreesLoaded:
      description: |
        One Directory's Worktrees (the ones Pixel Agents made, then the ones
        the CLI made itself in the worktrees folder, Claude Code's
        `.claude/worktrees/`, `owner: cli`), each with what it holds now.
        Sent to the client that asked (`requestWorktrees`), to
        every privileged client on connect for each Directory that has any,
        and broadcast to every privileged client after every change (an agent
        leaving, a decision). Never sent to read-only clients. A Worktree in
        state `needsDecision` opens the office's decision dialog; the list
        replaces whatever the client held for `directoryPath`.
      type: object
      additionalProperties: false
      required: [type, directoryPath, worktrees]
      properties:
        type:
          const: worktreesLoaded
        directoryPath:
          type: string
          description: The Directory (its repo root) the Worktrees belong to.
        worktrees:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeSummary'
        cliName:
          type: string
          description: >-
            The name of the CLI whose own worktrees are listed (`owner: cli`),
            as its provider gives it (e.g. "Claude Code"). Absent when no
            provider declares a worktrees folder: the CLI has none of its own.

    WorktreeSummary:
      description: |
        A Worktree as the office lists it. `uncommittedFiles`: changed and
        untracked files (not gitignored ones). `uniqueCommits`: commits on its
        branch whose changes are not in its base (patch-equivalence, so
        squash- or rebase-merged work counts as none). `agentId`: the agent
        running in it, when one is. `palette` + `repeat`: the look of the agent
        it belongs to (the first seen running in it, until that one has gone
        and another runs there), else its newest conversation's; absent when
        neither is known.
      type: object
      additionalProperties: false
      required: [name, branch, state, sizeBytes, uncommittedFiles, uniqueCommits, owner]
      properties:
        name:
          type: string
        branch:
          type: string
        owner:
          $ref: '#/components/schemas/WorktreeOwner'
        latestSessionId:
          type: string
          description: >-
            Its newest conversation (a session id `resumeConversation` takes),
            when it has one: the list's Resume action.
        state:
          $ref: '#/components/schemas/WorktreeState'
        sizeBytes:
          type: integer
          minimum: 0
        uncommittedFiles:
          type: integer
          minimum: 0
        uniqueCommits:
          type: integer
          minimum: 0
        agentId:
          type: integer
        palette:
          type: integer
          minimum: 0
        repeat:
          type: integer
          minimum: 0

    WorktreeOwner:
      description: |
        Who made a Worktree. `pixelAgents`: Pixel Agents (listed in its
        registry), so the office manages it. `cli`: the CLI made it itself
        under the Directory's worktrees folder (Claude Code: `claude -w`,
        EnterWorktree, under `.claude/worktrees/`):
        shown, and only ever removed — `remove` deletes its folder and branch
        once no agent or CLI session is in it (confirmed files and commits
        only), every other `decideWorktree` on it is refused — and its state
        is only `active` (an agent runs in it) or `kept`.
      type: string
      enum: [pixelAgents, cli]

    WorktreeState:
      description: |
        `active`: an agent runs in it. `kept`: its folder stays by the user's
        choice. `parked`: its folder was removed, its branch kept.
        `needsDecision`: its agent left uncommitted changes; the user decides.
      type: string
      enum: [active, kept, parked, needsDecision]

    WorktreeChoice:
      description: |
        The answer for a Worktree that needs a decision. `save`: commit every
        change (untracked files included) to its branch, then remove the
        folder. `keep`: leave the folder as it is. `discard`: delete the
        changes and the folder, and the branch too when it has no commits of
        its own. From the Worktrees list: `remove` applies the leave rules a
        departing agent's Worktree gets (so it may come back needing a
        decision), and `deleteBranch` deletes a parked Worktree's branch
        (needs `confirmedCommits` when its commits are merged nowhere). On one
        of the CLI's own, `remove` deletes the folder and its branch (needs
        `confirmedFiles` / `confirmedCommits` for what that loses).
      type: string
      enum: [save, keep, discard, remove, deleteBranch]

    WorktreeLeaveChoice:
      description: |
        The answer, given before an agent is closed, for the Worktree it
        leaves with uncommitted files: `save` (commit them to its branch,
        then remove the folder), `keep` (leave the folder) or `discard`
        (delete the changes with the folder). The same answers as
        `WorktreeChoice`'s first three.
      type: string
      enum: [save, keep, discard]

    AgentWorktree:
      description: |
        The Worktree an agent runs in: a separate checkout of its Directory's
        repo on a branch of its own. `name` is its folder under the repo's
        worktrees folder (Claude Code: `.claude/worktrees/`), `branch` its
        branch (the Directory's prefix + the name).
      type: object
      additionalProperties: false
      required: [name, branch]
      properties:
        name:
          type: string
        branch:
          type: string

    WorktreeBase:
      description: |
        What a Directory's new Worktrees start from. `head`: the main
        checkout's current commit (unpushed local work included). `fresh`: the
        latest default branch on origin, fetched at launch (the current commit
        when the fetch fails). Absent = `head`.
      type: string
      enum: [head, fresh]

    DirectorySuggestions:
      description: |
        Candidate paths for the Directory modal, recovered from the working
        directories recorded in the coding agent's own session transcripts across
        every session root — places the user has already run agents in, so adding
        a Directory on a phone rarely means typing one out.

        Sent point-to-point in reply to `requestDirectorySuggestions` (never
        broadcast). Already deduped, existence-checked and stripped of anything
        already in the Directory union, so the modal renders the list as-is; an
        empty list means the modal shows no suggestions section.
      type: object
      additionalProperties: false
      required: [type, paths]
      properties:
        type:
          const: directorySuggestions
        paths:
          type: array
          description: Absolute directory paths, ordered for stable display.
          items:
            type: string

    ConversationsLoaded:
      description: |
        The sidebar's recent conversations: for each Directory, the ones an
        agent in the office is running (with `agentId`) and its past ones,
        newest first: five in all, or as many as the request's `limits` asked
        for that Directory. Sent point-to-point in reply to
        `requestConversations` (never broadcast).
      type: object
      additionalProperties: false
      required: [type, directories]
      properties:
        type:
          const: conversationsLoaded
        directories:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryConversations'

    DirectoryConversations:
      type: object
      additionalProperties: false
      required: [name, path, conversations]
      properties:
        name:
          type: string
        path:
          type: string
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        more:
          type: boolean
          description: It has older past conversations than the ones listed (the sidebar offers to show more).

    ConversationSearchResults:
      description: >-
        The answer to `searchConversations`, to its sender only: the
        conversations whose title holds every word of `query` (any case; an
        empty query matches all), newest first, at most `limit`. Echoes the
        request, so a stale answer can be told apart.
      type: object
      additionalProperties: false
      required: [type, query, limit, results, more]
      properties:
        type:
          const: conversationSearchResults
        query:
          type: string
        directoryPath:
          type: string
        limit:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/FoundConversation'
        more:
          type: boolean
          description: More conversations match than `limit`.

    FoundConversation:
      description: A conversation a search found, with the Directory it is listed under.
      type: object
      additionalProperties: false
      required: [directoryPath, directoryName, conversation]
      properties:
        directoryPath:
          type: string
        directoryName:
          type: string
        conversation:
          $ref: '#/components/schemas/Conversation'

    Conversation:
      description: >-
        One conversation. `worktree`: the Directory's Worktree it ran in
        (Pixel Agents' or the CLI's own); resuming one whose folder was
        removed rebuilds the folder from its branch first.
      type: object
      additionalProperties: false
      required: [sessionId, title, updatedAt]
      properties:
        sessionId:
          type: string
        title:
          type: string
          description: The title the coding agent gave the conversation (a user rename wins), else its last prompt.
        updatedAt:
          type: number
          description: When the transcript last changed, in ms since the epoch.
        palette:
          type: integer
          description: The character the conversation's agent wears (running) or wore, when the office saw it.
        repeat:
          type: integer
        agentId:
          type: integer
          description: The agent in the office running it right now; absent for a past conversation.
        worktree:
          $ref: '#/components/schemas/AgentWorktree'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Terminal control plane (standalone embedded terminal) ──────
    # Only the CONTROL plane lives in this contract. The terminal's raw byte
    # stream is deliberately outside it, on a dedicated WebSocket endpoint
    # (GET /terminal/:agentId): it is unstructured, high-frequency data that
    # would otherwise pass through this discriminated union and the store's
    # broadcast fan-out (which would also leak one agent's output to every
    # connected client). See docs/design/standalone-terminal.md.

    OfficeAccess:
      description: >-
        Whether this connection may change anything. A read-only office (no
        valid server token, or a Host outside the allowlist) can load and watch
        the office but every change it sends is refused, so the client hides
        the controls that would send one. Sent first on webviewReady; a client
        that never receives it is not read-only.
      type: object
      additionalProperties: false
      required: [type, readOnly]
      properties:
        type:
          const: officeAccess
        readOnly:
          type: boolean

    TerminalAvailability:
      description: >-
        Whether this server can host embedded terminals. Standalone only; the
        VS Code surface owns its own terminals and never receives this. When
        false, the client hides terminal UI and shows `reason`.
      type: object
      additionalProperties: false
      required: [type, available]
      properties:
        type:
          const: terminalAvailability
        available:
          type: boolean
        reason:
          type: string
          description: Human-readable cause when unavailable (e.g. no PTY module installed).

    TerminalSessionOpened:
      description: >-
        A PTY-backed terminal now exists for this agent; the client may attach to
        GET /terminal/:agentId. Re-sent on webviewReady for every live session so
        a reconnecting client rebuilds its tabs.
      type: object
      additionalProperties: false
      required: [type, agentId]
      properties:
        type:
          const: terminalSessionOpened
        agentId:
          type: integer

    TerminalSessionClosed:
      description: The agent's terminal process exited; its socket is no longer attachable.
      type: object
      additionalProperties: false
      required: [type, agentId]
      properties:
        type:
          const: terminalSessionClosed
        agentId:
          type: integer
        exitCode:
          type: integer

    PcShell:
      description: >-
        One live PC shell: the plain login shell on the host a PC opened for
        the user. Not an agent: no provider, session, transcript, hooks, look
        or seat. Its id is its own (from PC_SHELL_ID_BASE up, apart from every
        agent id), the id its terminal socket (GET /terminal/:id) and its card
        go by.
      type: object
      additionalProperties: false
      required: [id, uid, furnitureType]
      properties:
        id:
          type: integer
        uid:
          type: string
          description: The piece (placed furniture uid) that opened it; the piece may have left the layout since.
        furnitureType:
          type: string
          description: The piece's furniture type when it opened (the card draws its sprite).
        directoryName:
          type: string
          description: The Directory it started in, by name as it was then. Absent = the home folder.

    PcShellsLoaded:
      description: >-
        Every live PC shell, the whole list: broadcast to privileged offices only
        (a view-only office sees the agents, never the operator's shells)
        whenever one opens or ends, and sent in their connect snapshot, so a
        reconnect is a resync.
      type: object
      additionalProperties: false
      required: [type, shells]
      properties:
        type:
          const: pcShellsLoaded
        shells:
          type: array
          items:
            $ref: '#/components/schemas/PcShell'

    PcShellReady:
      description: >-
        The answer to an `openPcShell`, to its sender alone: the shell that
        answers it (a new one, or the piece's live one). The office opens its
        terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: pcShellReady
        id:
          type: integer

    PcShellCloseQuestion:
      description: >-
        The answer to a `closePcShell` (not `confirmed`) for a shell with a
        command still running in it (its foreground process is not the shell
        itself): the shell is NOT closed, and the office asks the user once. A
        `closePcShell` with `confirmed` closes it. To the sender alone.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: pcShellCloseQuestion
        id:
          type: integer
        command:
          type: string
          description: The running command's name, when the host could tell.

    PcShellRejected:
      description: An `openPcShell` that could not be done, to its sender alone.
      type: object
      additionalProperties: false
      required: [type, uid, reason]
      properties:
        type:
          const: pcShellRejected
        uid:
          type: string
        reason:
          type: string

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        directoryPath:
          type: string
          description: Path of the Directory to launch into.
        palette:
          type: integer
          minimum: 0
          description: >-
            Character the agent wears, as an index into the character profiles
            (picked from the roster). Absent, the Directory's default characters
            apply, else the server picks one at random.
        worktree:
          type: boolean
          description: >-
            Launch into a new Worktree of the Directory's repo instead of the
            Directory itself. The agent is still an agent of its Directory
            (name, default characters, Areas). A failed create launches
            nothing and is answered with `worktreeRejected`.
        worktreeName:
          type: string
          description: >-
            With `worktree: true`: the Worktree's name (its folder, and its
            branch after the Directory's prefix). Absent = a generated one. A
            taken or invalid name is refused with `worktreeRejected`.
        worktreeFrom:
          $ref: '#/components/schemas/WorktreeBranch'
          description: >-
            With `worktree: true`: the branch to start from (an origin branch
            is fetched first, falling back to what was last fetched). Absent =
            the Directory's base setting.

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: >-
        Close (dismiss) an agent. One that would leave a Worktree of Pixel
        Agents' with uncommitted files is not closed: the server answers
        `agentCloseQuestion`, and the user's answer comes back as a
        `closeAgent` with `worktreeChoice`, which closes it and is applied to
        the Worktree once the agent has exited.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer
        worktreeChoice:
          $ref: '#/components/schemas/WorktreeLeaveChoice'
        confirmedFiles:
          type: integer
          minimum: 0
          description: >-
            `worktreeChoice: discard` only: how many files the user confirmed
            losing. Asked again (`agentCloseQuestion`) when more are
            uncommitted by the time it arrives.

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    LayoutEditing:
      description: |
        Whether this office's layout editor holds unsaved changes. While any
        office reports `dirty`, agents' layout edits and their undo are refused;
        `false` on save, reset or close, and dropped when the socket closes.
      type: object
      additionalProperties: false
      required: [type, dirty]
      properties:
        type:
          const: layoutEditing
        dirty:
          type: boolean

    UndoAgentLayoutEdit:
      description: |
        The layout editor's "Undo <agent>'s edit": restore the layout from before
        the newest Pixel Office MCP layout edit (undo_layout_edit's operation).
        Refused (answered with `agentLayoutEditStatus.refused`) when the layout
        changed since or an office holds unsaved editor changes.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: undoAgentLayoutEdit

    CharactersEditing:
      description: |
        Whether this office's Characters view holds an unsaved draft. While any
        office reports `dirty`, agents' Character edits (edit_characters) are
        refused; `false` on save, discard or close, and dropped when the socket
        closes.
      type: object
      additionalProperties: false
      required: [type, dirty]
      properties:
        type:
          const: charactersEditing
        dirty:
          type: boolean

    UndoAgentCharacterEdit:
      description: |
        The Characters view's "Undo <agent>'s edit": restore the roster and the
        Directories' default characters from before the newest Pixel Office MCP
        Character edit (undo_character_edit's operation). Refused (answered with
        `agentCharacterEditStatus.refused`) when they changed since or an office
        holds an unsaved Characters draft.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: undoAgentCharacterEdit

    SaveCharacterProfiles:
      description: |
        Replace the character profiles (~/.pixel-agents/characters.json). The server
        validates the list and persists it. It always answers with characterProfilesLoaded
        carrying this saveId: broadcast to every client on success, sent to this client
        alone (with the profiles still saved) when the list is refused or the write fails.
      type: object
      additionalProperties: false
      required: [type, profiles, saveId]
      properties:
        type:
          const: saveCharacterProfiles
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/CharacterProfile'
        saveId:
          type: string
          description: Client-chosen id for this save, echoed in the answering characterProfilesLoaded.
        items:
          type: array
          description: |
            The custom wardrobe items to save alongside the profiles. Absent = leave the
            saved items as they are.
          items:
            $ref: '#/components/schemas/WardrobeItem'

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    SetUsageBridgeEnabled:
      description: |
        Settings → Usage Bars: install the provider's usage bridge (the user
        confirmed its disclosure — this is the consent) or restore the user's
        settings. Answered with `usageBridgeStatus`.
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setUsageBridgeEnabled
        providerId:
          type: string
        enabled:
          type: boolean

    OfficeMcpConsentResponse:
      description: |
        The Intro's answer to `officeMcpConsentRequest` — an ABSOLUTE statement
        of the state the user wants, revisable with Back: `allow` records the
        grant, `decline` records a decline (and revokes every agent's access at
        once). Any other value writes nothing. One config write per answer.
      type: object
      additionalProperties: false
      required: [type, choice]
      properties:
        type:
          const: officeMcpConsentResponse
        choice:
          $ref: '#/components/schemas/OfficeMcpChoice'

    TutorialQuestState:
      description: Where one tutorial quest stands.
      type: string
      enum: [open, done, skipped]

    TutorialQuestProgress:
      description: One quest of the tutorial and where it stands (its title and goal are core's TUTORIAL_QUESTS).
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id:
          type: string
        state:
          $ref: '#/components/schemas/TutorialQuestState'

    TutorialRun:
      description: A tutorial under way — the agent running it and every quest's state.
      type: object
      additionalProperties: false
      required: [agentId, quests, finished]
      properties:
        agentId:
          type: integer
        quests:
          type: array
          items:
            $ref: '#/components/schemas/TutorialQuestProgress'
        finished:
          type: boolean

    TutorialStatus:
      description: |
        The tutorial as the server holds it: whether the Intro may offer it
        (`available`, else `unavailableReason` in plain words), the copy its
        permission step shows verbatim (`headline`, `disclosure`: it starts a
        Claude Code session), and the run under way, if any — the agent
        running it (the Guide) and every quest's state. `finished` once every quest
        is done or skipped (the run stays until its agent leaves or the user
        quits). Sent on connect and broadcast after every change, privileged
        connections of a server that offers the Pixel Office MCP only.
      type: object
      additionalProperties: false
      required: [type, available, headline, disclosure]
      properties:
        type:
          const: tutorialStatus
        available:
          type: boolean
        unavailableReason:
          type: string
        headline:
          type: string
        disclosure:
          type: string
          description: What starting it does (paragraphs split on blank lines).
        run:
          $ref: '#/components/schemas/TutorialRun'

    TutorialRejected:
      description: |
        A `startTutorial` that started nothing, to its sender alone: why (no
        Pixel Office MCP consent, no terminal, a run already under way, the
        launch failed).
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          const: tutorialRejected
        reason:
          type: string

    StartTutorial:
      description: |
        The user said yes to the tutorial's permission step and the greeter
        sat down: launch the Guide as a real Claude Code agent (wearing
        `palette`, the greeter's character, and named after it, in `seatId`,
        the seat it walked to, when free), given the Pixel Office MCP and the
        onboarding skill, its first message that skill's command. Answered with a `tutorialStatus`
        broadcast carrying the run, or `tutorialRejected` to the sender.
        Nothing launches without it.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: startTutorial
        palette:
          type: integer
          minimum: 0
        seatId:
          type: string

    SkipTutorialQuest:
      description: The user skipped a quest from the tutorial panel.
      type: object
      additionalProperties: false
      required: [type, questId]
      properties:
        type:
          const: skipTutorialQuest
        questId:
          type: string

    QuitTutorial:
      description: |
        The user quit the tutorial: the run ends and its Guide is
        closed, as its card's × would.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: quitTutorial

    OfficeMcpChoice:
      description: |
        An answer to the Intro's Pixel Office MCP ask, an absolute state:
        `allow` grants, `decline` declines for good, `notNow` leaves it
        unanswered (asked again on the next open; a revision from `allow`
        revokes every agent's access, as a decline does).
      type: string
      enum: [allow, notNow, decline]

    SetOfficeMcpEnabled:
      description: |
        Settings → Pixel Office MCP: on (the user confirmed its disclosure —
        this is the grant) or off (a decline: every running agent's access is
        revoked at once). Answered with an `officeMcpStatus` broadcast.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setOfficeMcpEnabled
        enabled:
          type: boolean

    SetOfficeMcpReadOnly:
      description: |
        Settings → Pixel Office MCP read-only: while on, agents may list and
        read through it, and every tool that would change something refuses.
        Takes effect at once for running agents. Answered with an
        `officeMcpStatus` broadcast.
      type: object
      additionalProperties: false
      required: [type, readOnly]
      properties:
        type:
          const: setOfficeMcpReadOnly
        readOnly:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ExportFile:
      description: |
        Save a file the client generated (a character sheet PNG, a roster zip, a profile
        JSON) through the host-native save dialog. Embedded hosts only; a browser client
        downloads it itself.
      type: object
      additionalProperties: false
      required: [type, filename, dataBase64]
      properties:
        type:
          const: exportFile
        filename:
          type: string
        dataBase64:
          type: string

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist Directory-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SaveCardOrder:
      description: Persist a reordered card list (agent and PC shell ids, first card first).
      type: object
      additionalProperties: false
      required: [type, order]
      properties:
        type:
          const: saveCardOrder
        order:
          type: array
          items:
            type: integer

    OpenPcShell:
      description: >-
        Open the PC shell of a piece (a placed furniture uid whose furniture
        declares the `terminal` panel): its live shell when it has one, else a
        new login shell in the named `directory` (one of the Directories mapped
        to the piece's Area: the office's Directory selector), else the single
        Directory mapped to the piece's Area, else the home folder. A
        `directory` that is not one of the Area's is refused. Answered with
        `pcShellReady` (or `pcShellRejected`). Privileged, and refused where the
        office offers no terminal.
      type: object
      additionalProperties: false
      required: [type, uid]
      properties:
        type:
          const: openPcShell
        uid:
          type: string
        directory:
          type: string
          description: The chosen Directory's name.

    ClosePcShell:
      description: >-
        End a PC shell (its card's ×). An idle shell ends at once; one running a
        command is answered with `pcShellCloseQuestion` unless `confirmed`.
        Privileged.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closePcShell
        id:
          type: integer
        confirmed:
          type: boolean
          description: The user confirmed closing it with a command running.

    SetBypassPermissions:
      description: >-
        Persist the host's skip-permissions posture. Applied host-side when
        building the launch command; never sent per launch.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setBypassPermissions
        enabled:
          type: boolean

    SetShowHostDirectories:
      description: >-
        Persist whether the host's own Directories are listed. Answered with a
        `directoriesLoaded` broadcast of the list as it now stands. Hiding them
        only changes the list: agents launched in a host Directory are still
        named after it.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowHostDirectories
        enabled:
          type: boolean

    SetUploadDirectory:
      description: >-
        Persist where files sent to a terminal are saved on the host. `path` is
        absolute or starts with `~/`; empty goes back to the default (the
        server's own uploads folder, which it sweeps). The folder is created when a file first
        lands in it. Answered to the sender with `settingsLoaded` carrying the
        directory as it now stands (unchanged when the path was refused).
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: setUploadDirectory
        path:
          type: string

    SaveDirectory:
      description: |
        Add or edit a user-defined Directory. `previousPath` identifies the entry
        being edited; absent means this is a new one.

        The host expands a leading `~`, then requires the path to exist and to be
        a directory. On success it rebroadcasts `directoriesLoaded`; on failure it
        replies `directoryRejected` and persists nothing.
      type: object
      additionalProperties: false
      required: [type, name, path]
      properties:
        type:
          const: saveDirectory
        name:
          type: string
          description: Display name. Empty falls back to the path's basename.
        path:
          type: string
          description: Filesystem path; a leading `~` is expanded host-side.
        previousPath:
          type: string
          description: Path of the entry being edited. Absent when adding.
        characters:
          type: array
          description: Default characters (profile indices), highest priority first.
          items:
            type: integer
            minimum: 0
        characterOrder:
          $ref: '#/components/schemas/DirectoryCharacterOrder'
        worktreeBase:
          $ref: '#/components/schemas/WorktreeBase'
        worktreeBranchPrefix:
          type: string
          description: The branch prefix for new Worktrees. Empty or absent = none.

    RemoveDirectory:
      description: >-
        Delete a user-defined Directory. Agents already running in it are left
        untouched.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeDirectory
        path:
          type: string

    RequestDirectorySuggestions:
      description: >-
        Ask the host for tappable path suggestions for the Directory modal; it
        replies `directorySuggestions` to this client only. Sent when the modal
        opens, so the list reflects the sessions on disk right then.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDirectorySuggestions

    RequestConversations:
      description: >-
        Ask for the sidebar's recent conversations; the host replies
        `conversationsLoaded` to this client only. `limits`: how many
        conversations to list for a Directory (its "Show more"); the rest
        get five.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestConversations
        limits:
          type: array
          items:
            $ref: '#/components/schemas/ConversationLimit'

    ConversationLimit:
      type: object
      additionalProperties: false
      required: [directoryPath, count]
      properties:
        directoryPath:
          type: string
        count:
          type: integer

    SearchConversations:
      description: >-
        Search every Directory's conversations by title (or one Directory's,
        with `directoryPath`); the host replies `conversationSearchResults`
        to this client only. An empty query lists them all, newest first.
      type: object
      additionalProperties: false
      required: [type, query, limit]
      properties:
        type:
          const: searchConversations
        query:
          type: string
        directoryPath:
          type: string
        limit:
          type: integer
          description: At most this many results (more are asked for by asking again with a larger limit).

    ResumeConversation:
      description: >-
        Resume a past conversation in a new terminal: the agent comes back
        wearing the character it wore, in the seat it sat in when that seat is
        free. Ignored when an agent in the office is already running it. A
        conversation of a Worktree resumes in the Worktree's folder, rebuilt
        from its branch when it was removed (saved changes come back
        uncommitted); refused with `worktreeRejected` when it can't be (its
        branch was deleted, something else sits at its path).
      type: object
      additionalProperties: false
      required: [type, sessionId, directoryPath]
      properties:
        type:
          const: resumeConversation
        sessionId:
          type: string
        directoryPath:
          type: string
          description: Path of the Directory the conversation was listed under.

    RequestWorktrees:
      description: >-
        Ask for one Directory's Worktrees; the host replies `worktreesLoaded`
        to this client only. Privileged (refused for read-only clients).
      type: object
      additionalProperties: false
      required: [type, directoryPath]
      properties:
        type:
          const: requestWorktrees
        directoryPath:
          type: string

    RequestWorktreeOptions:
      description: >-
        Ask what a new Worktree of a Directory's repo can be: the host replies
        `worktreeOptions` to this client only. Privileged.
      type: object
      additionalProperties: false
      required: [type, directoryPath]
      properties:
        type:
          const: requestWorktreeOptions
        directoryPath:
          type: string

    DecideWorktree:
      description: >-
        Answer for a Worktree no agent runs in (the decision dialog). Decided
        on the Worktree's state when it arrives, and answered by a
        `worktreesLoaded` broadcast, or `worktreeDecisionRejected` to this
        client when it could not be done. Privileged (refused for read-only clients).
      type: object
      additionalProperties: false
      required: [type, directoryPath, name, choice]
      properties:
        type:
          const: decideWorktree
        directoryPath:
          type: string
          description: The Directory the Worktree belongs to.
        name:
          type: string
          description: >-
            The Worktree's name (its folder in the worktrees folder,
            `.claude/worktrees/` for Claude Code).
        choice:
          $ref: '#/components/schemas/WorktreeChoice'
        confirmedFiles:
          type: integer
          minimum: 0
          description: >-
            `discard`, and `remove` of one of the CLI's own worktrees: how
            many files the user confirmed losing. Refused when more are
            uncommitted by the time it arrives.
        confirmedCommits:
          type: integer
          minimum: 0
          description: >-
            `deleteBranch`, and `remove` of one of the CLI's own worktrees
            (which deletes its branch too): how many commits the user
            confirmed losing (the ones merged into no other branch). Refused
            when more would be lost by the time it arrives; absent = none may
            be.

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    UsageWindow:
      description: One rate-limit window of the account's plan.
      type: object
      additionalProperties: false
      required: [usedPercentage, resetsAt]
      properties:
        usedPercentage:
          type: number
          description: Share of the window used, 0-100.
        resetsAt:
          type: number
          description: When the window resets (Unix epoch SECONDS).

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, repeat, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        repeat:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, repeat, seatId]
      properties:
        palette:
          type: integer
        repeat:
          type: integer
        seatId:
          type: [string, 'null']

    Directory:
      description: |
        A named filesystem location agents can be launched into. `source` marks
        where the entry came from: `host` entries are contributed by the host
        (VS Code's workspace folders, standalone's start directory) and are
        read-only in the office; `user` entries are defined by the user.
      type: object
      additionalProperties: false
      required: [name, path, source, isRepo]
      properties:
        name:
          type: string
        path:
          type: string
        source:
          $ref: '#/components/schemas/DirectorySource'
        isRepo:
          type: boolean
          description: >-
            Whether the Directory is a git repo's root, so agents can be
            launched into Worktrees of it.
        hasOrigin:
          type: boolean
          description: >-
            Whether that repo has an `origin` remote, so its Worktrees can
            start from origin's default branch. Absent = no.
        worktreeBase:
          $ref: '#/components/schemas/WorktreeBase'
        worktreeBranchPrefix:
          type: string
          description: >-
            Put before a new Worktree's generated name to make its branch
            (`feature/` gives `feature/brave-otter`). Absent = none.
        characters:
          type: array
          description: >-
            Default characters for agents launched here, as indices into the
            character profiles, highest priority first. Absent or empty = no
            defaults (the server picks at random). A roster pick always wins.
          items:
            type: integer
            minimum: 0
        characterOrder:
          $ref: '#/components/schemas/DirectoryCharacterOrder'

    DirectoryCharacterOrder:
      description: |
        How a launch into a Directory picks from its default `characters`.
        `priority`: the first one no agent in the office wears; all worn, a random
        pick from the whole cast. `random`: a random one no agent wears; all worn,
        a random one of them. Absent = `priority`.
      type: string
      enum: [priority, random]

    DirectorySource:
      description: |
        Where a Directory came from. `host` entries are contributed by the host
        and are read-only in the office; `user` entries are defined by the user.
      type: string
      enum: [user, host]

    WardrobeItem:
      description: |
        A custom wardrobe part (core/src/wardrobeItems.ts): one piece's 128x96 sheet,
        uncoloured, saved from the pixel editor (an item saved before the seated frame is
        112x96; the webview derives its seated frame). It takes the colours of the part it was
        started from (base). Validated by parseWardrobeItems.
      type: object
      additionalProperties: false
      required: [id, piece, label, base, png]
      properties:
        id:
          type: string
          description: The part id characters wear it under ('custom_' + letters and digits).
        piece:
          type: string
          description: The slot it is worn in ('hair', 'top', 'hat', ...).
        label:
          type: string
        base:
          type: string
          description: The built-in part it was started from; its colourways and palette apply.
        png:
          type: string
          description: The 128x96 sheet (older items 112x96) as a base64 PNG.

    CharacterProfile:
      description: |
        One character (core/src/characterProfiles.ts): a wardrobe part id per slot, colours
        and pixel edits. The webview composes it into a 128x96 sheet; part ids mean
        something only to it. Open (additionalProperties) so older formats still reach the
        migration in parseCharacterProfiles, which is the authoritative validator.
      type: object
      additionalProperties: true
      required: [body]
      properties:
        id:
          type: string
          description: |
            The character's permanent id (letters, digits, '-' and '_', up to 64). Agents,
            Directory defaults, the roster's recency and past conversations name a character
            by its index in the list; when a save inserts, deletes or moves characters, the
            server matches the old and new lists by this id and renumbers those references.
            Unique in a list. Absent on profiles saved before ids existed; the validator
            gives those `char-<index>`.
        name:
          type: string
        body:
          type: string
          description: Body build ('flat' or 'bust'). The only required part.
        eyeShape:
          type: string
          description: Eye shape id; absent = the body's own.
        eyeRows:
          type: string
          description: Which eye pixel takes the eye colour ('top', 'bottom' or 'both'); absent = bottom.
        utop:
          type: string
        under:
          type: string
        hair:
          type: string
        beard:
          type: string
        top:
          type: string
        jacket:
          type: string
        pants:
          type: string
        shoes:
          type: string
        full:
          type: string
        hat:
          type: string
        necklace:
          type: string
        lanyard:
          type: string
        earrings:
          type: string
        shades:
          type: string
        hairshades:
          type: string
        watch:
          type: string
        colors:
          type: object
          description: Colour per colour key (skin, eyes, hair, top, ...).
          additionalProperties:
            $ref: '#/components/schemas/CharacterColor'
        edits:
          type: object
          description: Pixel edits per pixel set id ('<piece>:<part id>').
          additionalProperties:
            $ref: '#/components/schemas/CharacterPixelEdits'
        v:
          type: number
          description: Profile format version (older versions are migrated on read).

    AgentLook:
      description: An agent's look (see agentCreated.palette and repeat).
      type: object
      additionalProperties: false
      required: [id, palette, repeat]
      properties:
        id:
          type: number
        palette:
          type: number
        repeat:
          type: number

    CharacterColor:
      description: A part's colour, HSBC sliders optionally over one of the part's exact colourways.
      type: object
      additionalProperties: false
      required: [h, s, b, c]
      properties:
        h:
          type: number
        s:
          type: number
        b:
          type: number
        c:
          type: number
        colorize:
          type: boolean
        palette:
          type: string
          description: Name of an exact colour swap from the part's art (e.g. a skin tone).

    CharacterPixelEdits:
      description: |
        Uncoloured pixel edits on one piece. `cells[frame][pixel]` is '#rrggbb' to paint
        or null to erase (frame 0-23 = row * 8 + frame, pixel y*16+x). There is no revision counter (the
        renderer caches by content); an older format's `rev` is dropped by the migration.
      type: object
      additionalProperties: false
      required: [cells]
      properties:
        cells:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: [string, 'null']

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
        interactive:
          $ref: '#/components/schemas/FurnitureInteractive'

    FurnitureInteractive:
      description: |
        How a furniture takes part in the office (CONTEXT.md → Interactive furniture), as
        its manifest's `interactive` block declares it, validated where the manifest was
        read (core/src/furniture/interactive.ts) and carried on every asset of that
        furniture. Every part is optional; a block that failed validation is never sent
        (the furniture is plain furniture). A condition list holds when ANY of its
        conditions does.
      type: object
      additionalProperties: false
      properties:
        agentUse:
          $ref: '#/components/schemas/FurnitureAgentUse'
        label:
          $ref: '#/components/schemas/FurnitureLabelSpec'
        panel:
          $ref: '#/components/schemas/FurniturePanel'
        states:
          type: array
          description: |
            Which declared state a piece shows under which condition, the first rule
            whose condition holds winning; no rule holding = its usual sprite.
          items:
            $ref: '#/components/schemas/FurnitureStateRule'

    FurnitureAgentUse:
      description: |
        How agents use a furniture: `workstation` = agents work here (a seat facing it
        pairs with it, and its agent at work is the `agentWorking` condition).
      type: string
      enum: [workstation]

    FurniturePanel:
      description: The panel the office provides that a piece opens (CONTEXT.md → Panel).
      type: string
      enum: [terminal]

    FurnitureCondition:
      description: |
        A fact the office holds about a piece: `agentWorking` = an agent is working at
        it; `panelInUse` = its panel is in use (a PC: a live PC shell); `free` = neither.
      type: string
      enum: [agentWorking, panelInUse, free]

    FurnitureLabelSpec:
      description: |
        A Furniture label: its name, then the first of its lines whose condition
        holds (a label says one thing: list the lines in the order a click resolves).
        A line's text may name `{agent}` (the agent working at it; only in a line shown
        on `agentWorking` alone) or `{panel}` (what its panel holds, a PC shell's
        Directory; only in a line shown on `panelInUse` alone).
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureLabelLine'

    FurnitureLabelLine:
      type: object
      additionalProperties: false
      required: [when, text]
      properties:
        when:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureCondition'
        text:
          type: string

    FurnitureStateRule:
      type: object
      additionalProperties: false
      required: [state, when]
      properties:
        state:
          type: string
          description: One of the furniture's declared states (its manifest's `state` values).
        when:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureCondition'
