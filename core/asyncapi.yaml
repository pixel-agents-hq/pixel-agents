# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/BypassPermissionsUpdated'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/DirectoriesLoaded'
        - $ref: '#/components/schemas/DirectorySaved'
        - $ref: '#/components/schemas/DirectoryRejected'
        - $ref: '#/components/schemas/DirectorySuggestions'
        # Workspaces
        - $ref: '#/components/schemas/WorkspacesLoaded'
        - $ref: '#/components/schemas/WorkspaceRejected'
        - $ref: '#/components/schemas/AgentWorkspaceChanged'
        # Workspace curators (standalone only, in memory)
        - $ref: '#/components/schemas/CuratorsLoaded'
        - $ref: '#/components/schemas/WorkspaceCuratorChanged'
        - $ref: '#/components/schemas/CuratorBindingChanged'
        - $ref: '#/components/schemas/CuratorRejected'
        # Write-guard status (standalone only; one per agent)
        - $ref: '#/components/schemas/AgentGuardStatus'
        # Roles (point-to-point replies to the requesting client only)
        - $ref: '#/components/schemas/RolesAvailable'
        - $ref: '#/components/schemas/RolePreview'
        - $ref: '#/components/schemas/RoleConfirmed'
        - $ref: '#/components/schemas/RoleRejected'
        # Knowledge Base browsing (read-only; point-to-point replies only)
        - $ref: '#/components/schemas/KbFilesListed'
        - $ref: '#/components/schemas/KbFileRead'
        - $ref: '#/components/schemas/KbRejected'
        # Terminal (standalone embedded terminal control plane)
        - $ref: '#/components/schemas/TerminalAvailability'
        - $ref: '#/components/schemas/TerminalSessionOpened'
        - $ref: '#/components/schemas/TerminalSessionClosed'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/CreateAgent'
        - $ref: '#/components/schemas/StartAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/SetBypassPermissions'
        - $ref: '#/components/schemas/SetShowHostDirectories'
        - $ref: '#/components/schemas/SaveDirectory'
        - $ref: '#/components/schemas/RemoveDirectory'
        - $ref: '#/components/schemas/SaveWorkspace'
        - $ref: '#/components/schemas/RemoveWorkspace'
        - $ref: '#/components/schemas/SetWorkspaceRoot'
        - $ref: '#/components/schemas/SetWorkspacePermissionRoles'
        - $ref: '#/components/schemas/SetWorkspaceCurator'
        - $ref: '#/components/schemas/UnsetWorkspaceCurator'
        - $ref: '#/components/schemas/RequestRoles'
        - $ref: '#/components/schemas/RequestRolePreview'
        - $ref: '#/components/schemas/ConfirmRole'
        - $ref: '#/components/schemas/ListKbFiles'
        - $ref: '#/components/schemas/ReadKbFile'
        - $ref: '#/components/schemas/RequestDirectorySuggestions'
        - $ref: '#/components/schemas/RequestDiagnostics'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        directoryName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).
        workspaceId:
          type: string
          description: >-
            Id of the Workspace the agent belongs to. Absent means the default
            Workspace (agents that never carried one, including VS Code panel
            agents).
        roleName:
          $ref: '#/components/schemas/RoleName'
        name:
          type: string
          description: >-
            Display name given when the agent was created (`createAgent`). Absent:
            the client labels the agent by its Directory name.
        stopped:
          type: boolean
          description: >-
            True when the agent exists as a record with no process yet
            (`createAgent` without `start`, or a record restored after a restart).
            `terminalSessionOpened` follows when it is started. Absent or false:
            the agent is running or was observed from outside.

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, directoryNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        directoryNames:
          type: object
          description: Map of agent ID (string) to Directory name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean
        workspaceIds:
          type: object
          description: >-
            Map of agent ID (string) to Workspace id. An agent missing from the
            map (or the whole map being absent) belongs to the default Workspace.
          additionalProperties:
            type: string
        names:
          type: object
          description: >-
            Map of agent ID (string) to the display name given at creation. An
            agent missing from the map is labelled by its Directory name.
          additionalProperties:
            type: string
        stoppedAgents:
          type: object
          description: >-
            Map of agent ID (string) to true for agents that exist as a record
            with no process yet (see `agentCreated.stopped`). Absent entries are
            running or observed from outside.
          additionalProperties:
            type: boolean
        roleNames:
          type: object
          description: >-
            Map of agent ID (string) to the display name of the Role the agent
            was launched with. Only the name: never the Role's content or hash.
            An agent missing from the map (or the whole map being absent) was
            launched without a Role.
          additionalProperties:
            $ref: '#/components/schemas/RoleName'

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
        - showAreas
        - bypassPermissions
        - showHostDirectories
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean
        bypassPermissions:
          type: boolean
          description: >-
            Persistent per-host permission posture. While true, every launch on
            this host runs the CLI with its skip-permissions flag.
        showHostDirectories:
          type: boolean
          description: >-
            Persistent per-host choice whether the host's own Directories (VS
            Code's workspace folders, standalone's start directory) are listed
            in `directoriesLoaded`. Off by default.

    BypassPermissionsUpdated:
      description: |
        The host's skip-permissions posture changed (an accepted
        `setBypassPermissions`). Broadcast to every connected office, the one
        that sent it included, so every Settings toggle shows the posture the
        next launch will actually use. `enabled` is the persisted value read
        back after the write, not an echo of the request.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: bypassPermissionsUpdated
        enabled:
          type: boolean

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed.

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, disclosure]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Directory-to-Area mappings. Directory names map to one or more Area
        labels; new agents from that Directory prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of Directory name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    DirectoriesLoaded:
      description: |
        The Directories agents can be launched into: the union of the user-defined
        entries (machine-wide, shared by every host) and the host's own native
        context, contributed as `source: host` entries — VS Code its workspace
        folders, standalone the directory the server was started from. Deduped by
        path with the user-defined entry winning, and ordered alphabetically by
        name.

        Rebroadcast to every connected office after every Directory mutation
        (`saveDirectory`, `removeDirectory`). A client learns its own delete
        succeeded from this; a save is acked separately by `directorySaved`.
      type: object
      additionalProperties: false
      required: [type, directories]
      properties:
        type:
          const: directoriesLoaded
        directories:
          type: array
          items:
            $ref: '#/components/schemas/Directory'

    DirectorySaved:
      description: |
        A `saveDirectory` was accepted and persisted. Sent point-to-point to the
        requesting client (never broadcast), right after the `directoriesLoaded`
        rebroadcast. Carries the entry exactly as stored: the host resolves the
        path (tilde expansion, absolute resolution) and names an unnamed entry
        after the resolved basename, so `directory.name` can differ from
        anything the client typed. Area mappings are keyed by Directory name,
        so a client assigning Areas in the same save keys them by this name.
      type: object
      additionalProperties: false
      required: [type, directory]
      properties:
        type:
          const: directorySaved
        directory:
          $ref: '#/components/schemas/Directory'

    DirectoryRejected:
      description: |
        A `saveDirectory` failed host-side validation, or a `saveDirectory` /
        `removeDirectory` could not be written to the shared config. Sent
        point-to-point to the requesting client (never broadcast) and nothing
        changed on disk; the Directory modal stays open and shows `reason` inline.
      type: object
      additionalProperties: false
      required: [type, path, reason]
      properties:
        type:
          const: directoryRejected
        path:
          type: string
          description: The path exactly as submitted, before tilde expansion.
        reason:
          type: string
          description: Human-readable cause, shown inline in the Directory modal.

    DirectorySuggestions:
      description: |
        Candidate paths for the Directory modal, recovered from the working
        directories recorded in the coding agent's own session transcripts across
        every session root — places the user has already run agents in, so adding
        a Directory on a phone rarely means typing one out.

        Sent point-to-point in reply to `requestDirectorySuggestions` (never
        broadcast). Already deduped, existence-checked and stripped of anything
        already in the Directory union, so the modal renders the list as-is; an
        empty list means the modal shows no suggestions section.
      type: object
      additionalProperties: false
      required: [type, paths]
      properties:
        type:
          const: directorySuggestions
        paths:
          type: array
          description: Absolute directory paths, ordered for stable display.
          items:
            type: string

    WorkspacesLoaded:
      description: |
        The Workspaces agents are grouped into, each listing the paths of the
        Directories it contains. Sent during the handshake after
        `directoriesLoaded` and before `existingAgents`, so the client can place
        every agent on arrival.

        Rebroadcast to every connected office after every Workspace mutation
        (`saveWorkspace`, `removeWorkspace`, `setWorkspaceRoot`,
        `setWorkspacePermissionRoles`). A client learns its own save or delete
        succeeded from this.
      type: object
      additionalProperties: false
      required: [type, workspaces]
      properties:
        type:
          const: workspacesLoaded
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'

    WorkspaceRejected:
      description: |
        A `saveWorkspace`, `removeWorkspace`, `setWorkspaceRoot` or
        `setWorkspacePermissionRoles` failed
        validation or could not be written. Sent point-to-point to the requesting client (never broadcast)
        and nothing changed on disk.
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          const: workspaceRejected
        reason:
          type: string
          description: Human-readable cause, shown inline to the user.

    AgentWorkspaceChanged:
      description: >-
        An agent's Workspace membership changed (for example its working
        directory was resolved, or its Workspace was removed). Broadcast to every
        connected office.
      type: object
      additionalProperties: false
      required: [type, id, workspaceId]
      properties:
        type:
          const: agentWorkspaceChanged
        id:
          type: integer
        workspaceId:
          type: string

    # ── Workspace curators ─────────────────────────────────────────
    # At most one agent per Workspace, appointed by the operator, held in the
    # host's memory only (a restart starts with none). Only an agent this host
    # launched in a terminal into that Workspace is eligible. Messages carry ids only. The
    # default Workspace is always named `default`.
    # A non-default Workspace's operator appointment is also remembered as a
    # binding (Workspace id + the agent's Directory realpath, persisted by the
    # host): after a restart, the next operator launch that matches it takes
    # the vacant slot again. Bindings carry a Directory path, never a Role.

    CuratorsLoaded:
      description: >-
        Sent to this client only during the handshake, after
        `workspacesLoaded`. `available` is true only on a standalone host with
        a runtime, a terminal manager and a curator table; the client
        shows curator controls only when it is true. `curators` and
        `bindings` are empty when unavailable. `bindings` is always sent by this
        host; it is optional only so a host that predates bindings stays
        valid (treat an absent list as empty).
      type: object
      additionalProperties: false
      required: [type, available, curators]
      properties:
        type:
          const: curatorsLoaded
        available:
          type: boolean
        curators:
          type: array
          items:
            $ref: '#/components/schemas/CuratorEntry'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/CuratorBinding'

    CuratorBindingChanged:
      description: >-
        A Workspace's KB Writer binding changed. Broadcast to every connected
        office on every change: set by an operator appointment, removed by
        `unsetWorkspaceCurator`, by removing the Workspace, or by a
        `saveWorkspace` after which the bound Directory no longer belongs to
        the Workspace. `directoryPath` is the bound Directory's realpath, or
        null when the Workspace no longer has a binding. An agent exiting
        never changes a binding.
      type: object
      additionalProperties: false
      required: [type, workspaceId, directoryPath]
      properties:
        type:
          const: curatorBindingChanged
        workspaceId:
          type: string
        directoryPath:
          type: [string, 'null']

    WorkspaceCuratorChanged:
      description: >-
        A Workspace's curator changed. Broadcast to every connected office.
        `agentId` is null when the Workspace no longer has one (dismissed, the
        agent was removed or moved to another Workspace, all agents were
        cleared, or the Workspace was removed).
      type: object
      additionalProperties: false
      required: [type, workspaceId, agentId]
      properties:
        type:
          const: workspaceCuratorChanged
        workspaceId:
          type: string
        agentId:
          type: [integer, 'null']

    CuratorRejected:
      description: >-
        A `setWorkspaceCurator` or `unsetWorkspaceCurator` was refused. Sent
        point-to-point to the requesting client (never broadcast); nothing
        changed. `reason` is a fixed string for the code.
      type: object
      additionalProperties: false
      required: [type, code, reason]
      properties:
        type:
          const: curatorRejected
        code:
          $ref: '#/components/schemas/CuratorRejectionCode'
        reason:
          type: string
          description: Human-readable cause, shown inline to the user.

    # ── Roles ──────────────────────────────────────────────────────
    # A Role is a file `<Directory>/.claude/roles/<roleId>` appended to an
    # agent's system prompt at launch. There is no registry: the Roles of a
    # Directory are the files actually there, enumerated on request. Every
    # Role reply is point-to-point to the requesting client and never
    # broadcast.

    RolesAvailable:
      description: |
        Reply to `requestRoles`: the Roles found in the Directory right now.
        Enumeration never reads file contents; only plain files whose names
        pass the Role id allowlist are listed (no symlinks, FIFOs, devices or
        oversized files), and names that differ only in letter case are both
        left out. Empty when the Directory has no `.claude/roles/`, or when
        `.claude` or `.claude/roles` is a symlink.
      type: object
      additionalProperties: false
      required: [type, directoryPath, roles]
      properties:
        type:
          const: rolesAvailable
        directoryPath:
          type: string
          description: Path of the registered Directory that was enumerated.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEntry'

    RolePreview:
      description: |
        Reply to `requestRolePreview`: the Role file as the host read it, for
        the operator to review before trusting it. Plain text only -- a client
        must never render it as HTML or markdown. Characters that are
        invisible on screen (format characters such as zero-width and
        direction marks, non-ASCII spaces, private-use and unassigned code
        points) are already replaced by visible `<U+XXXX>` markers; files
        holding control, tag or bidirectional-override characters, a BOM, or
        invalid UTF-8 are refused with `roleRejected` instead.
      type: object
      additionalProperties: false
      required: [type, directoryPath, roleId, content, sha256, size, mtime, trusted]
      properties:
        type:
          const: rolePreview
        directoryPath:
          type: string
          description: Path of the registered Directory the Role belongs to.
        roleId:
          $ref: '#/components/schemas/RoleId'
        content:
          type: string
          description: >-
            The file's text with invisible characters escaped as `<U+XXXX>`
            markers (display text, not the raw bytes).
        sha256:
          $ref: '#/components/schemas/RoleSha256'
        size:
          type: integer
          description: File size in bytes.
        mtime:
          type: string
          format: date-time
          description: Last modification time (ISO 8601, UTC).
        trusted:
          type: boolean
          description: >-
            True when this exact content (same Directory, Role id and sha256)
            was already confirmed by the operator.

    RoleConfirmed:
      description: >-
        Reply to a successful `confirmRole`: the host re-read the file, its
        sha256 matched the one the operator reviewed, and that content is now
        trusted. A client sends a `launchAgent` carrying the Role only after
        receiving this.
      type: object
      additionalProperties: false
      required: [type, directoryPath, roleId, sha256]
      properties:
        type:
          const: roleConfirmed
        directoryPath:
          type: string
        roleId:
          $ref: '#/components/schemas/RoleId'
        sha256:
          $ref: '#/components/schemas/RoleSha256'

    RoleRejected:
      description: >-
        A Role request (or a `launchAgent` carrying a Role) was refused.
        Nothing was launched and no agent id was used. `reason` never contains
        the Role's content or any resolved filesystem path.
      type: object
      additionalProperties: false
      required: [type, code, reason]
      properties:
        type:
          const: roleRejected
        code:
          $ref: '#/components/schemas/RoleRejectionCode'
        reason:
          type: string
          description: Human-readable cause, shown inline to the user.

    # ── Knowledge Base browsing (read-only) ───────────────────────
    # Read-only browsing of an agent's personal KB
    # (`<agent Directory>/.note/<identity key>/`) or a Workspace KB
    # (`<Workspace root>/.note/`). Every reply is point-to-point to the
    # requesting client and never broadcast. Nothing here creates, writes or
    # follows a symlink.

    KbFilesListed:
      description: |
        Reply to `listKbFiles`: the text files found in the KB right now.
        Listing reads no file contents. Only plain files (no symlinks, FIFOs,
        devices or hard-linked files) with an allowlisted extension (`.md`,
        `.txt`) are listed; symlinked directories are not descended, names
        starting with `.` and names holding control, invisible or
        bidirectional characters are left out, and names that differ only in
        letter case are both left out. The scan is bounded in depth and entry
        count; `truncated` is true when a bound cut it short.
      type: object
      additionalProperties: false
      required: [type, target, files, truncated]
      properties:
        type:
          const: kbFilesListed
        target:
          $ref: '#/components/schemas/KbTarget'
        files:
          type: array
          items:
            $ref: '#/components/schemas/KbFileEntry'
        truncated:
          type: boolean

    KbFileRead:
      description: |
        Reply to `readKbFile`: one KB file's text. Plain text only -- a client
        must never render it as HTML. Files that are not valid UTF-8 or that
        hold control, tag or bidirectional-override characters or a BOM are
        refused with `kbRejected` (`not_text`) instead.
      type: object
      additionalProperties: false
      required: [type, target, relPath, content]
      properties:
        type:
          const: kbFileRead
        target:
          $ref: '#/components/schemas/KbTarget'
        relPath:
          $ref: '#/components/schemas/KbRelPath'
        content:
          type: string

    KbRejected:
      description: >-
        A KB request was refused. `target` and `relPath` echo the request so
        the client can match the reply; `target` is absent only when the
        request's own target was malformed, `relPath` when the request carried
        none (a listing) or an unusable one. Never carries file content or a
        resolved filesystem path.
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          const: kbRejected
        target:
          $ref: '#/components/schemas/KbTarget'
        relPath:
          type: string
        reason:
          $ref: '#/components/schemas/KbRejectionReason'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Terminal control plane (standalone embedded terminal) ──────
    # Only the CONTROL plane lives in this contract. The terminal's raw byte
    # stream is deliberately outside it, on a dedicated WebSocket endpoint
    # (GET /terminal/:agentId): it is unstructured, high-frequency data that
    # would otherwise pass through this discriminated union and the store's
    # broadcast fan-out (which would also leak one agent's output to every
    # connected client). See docs/design/standalone-terminal.md.

    TerminalAvailability:
      description: >-
        Whether this server can host embedded terminals. Standalone only; the
        VS Code surface owns its own terminals and never receives this. When
        false, the client hides terminal UI and shows `reason`.
      type: object
      additionalProperties: false
      required: [type, available]
      properties:
        type:
          const: terminalAvailability
        available:
          type: boolean
        reason:
          type: string
          description: Human-readable cause when unavailable (e.g. no PTY module installed).

    TerminalSessionOpened:
      description: >-
        A PTY-backed terminal now exists for this agent; the client may attach to
        GET /terminal/:agentId. Re-sent on webviewReady for every live session so
        a reconnecting client rebuilds its tabs.
      type: object
      additionalProperties: false
      required: [type, agentId]
      properties:
        type:
          const: terminalSessionOpened
        agentId:
          type: integer

    TerminalSessionClosed:
      description: The agent's terminal process exited; its socket is no longer attachable.
      type: object
      additionalProperties: false
      required: [type, agentId]
      properties:
        type:
          const: terminalSessionClosed
        agentId:
          type: integer
        exitCode:
          type: integer

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: |
        Launch a new Claude agent in a new terminal.

        `roleId` (optional, standalone only) appends that Role to the agent's
        system prompt. It requires `directoryPath` naming a registered
        Directory, the Role being listed there right now, and its current
        content having been confirmed (`roleConfirmed`); otherwise the host
        replies `roleRejected`, launches nothing and uses no agent id -- it
        never falls back to a launch without the Role. The VS Code panel always
        refuses it with `roleRejected` code `unavailable`. Without `roleId` the
        launch is exactly as before.

        `permissionRoles` (optional, standalone only) overrides the Workspace's
        default permission roles for this agent: an array is the agent's
        roles, `null` means no roles (everything allowed). Absent: the
        Workspace default, else no roles. The effective roles are snapshotted
        at launch; changing the Workspace default later does not affect a
        running agent. An invalid value launches nothing (with a `roleId`, the
        host replies `roleRejected` code `invalid`).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        directoryPath:
          type: string
          description: Path of the Directory to launch into.
        roleId:
          $ref: '#/components/schemas/RoleId'
        permissionRoles:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionRole'

    CreateAgent:
      description: |
        Standalone only. Create an agent record in the Workspace that
        owns `directoryPath`, without starting Claude Code (unless `start` is
        true). The host replies `agentCreated` (with `stopped: true` when not
        started); a started agent also gets `terminalSessionOpened`. A stopped
        record survives a host restart and is started later with `startAgent`.

        `permissionRoles` has the same meaning as on `launchAgent` and is stored
        on the record: an array is the agent's roles, `null` means no roles,
        absent takes the Workspace default at start time. An invalid value
        creates nothing.
      type: object
      additionalProperties: false
      required: [type, directoryPath]
      properties:
        type:
          const: createAgent
        name:
          type: string
          description: Display name (trimmed, at most 64 characters). Empty is ignored.
        directoryPath:
          type: string
          description: Path of the Directory to run the agent in.
        permissionRoles:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionRole'
        start:
          type: boolean
          description: Start the agent right after creating it. Default false.

    StartAgent:
      description: |
        Standalone only. Start Claude Code for a stopped agent record.
        The host resumes the agent's conversation (`claude --resume`) when its
        transcript already exists, and starts a fresh one otherwise. On success
        the host sends `terminalSessionOpened`; an agent that is not stopped, or
        a spawn that fails, changes nothing.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: startAgent
        id:
          type: integer

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist Directory-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SetBypassPermissions:
      description: >-
        Persist the host's skip-permissions posture. Applied host-side when
        building the launch command; never sent per launch.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setBypassPermissions
        enabled:
          type: boolean

    SetShowHostDirectories:
      description: >-
        Persist whether the host's own Directories are listed. Answered with a
        `directoriesLoaded` broadcast of the list as it now stands. Hiding them
        only changes the list: agents launched in a host Directory are still
        named after it.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowHostDirectories
        enabled:
          type: boolean

    SaveDirectory:
      description: |
        Add or edit a user-defined Directory. `previousPath` identifies the entry
        being edited; absent means this is a new one.

        The host expands a leading `~`, then requires the path to exist and to be
        a directory. On success it rebroadcasts `directoriesLoaded`; on failure it
        replies `directoryRejected` and persists nothing.
      type: object
      additionalProperties: false
      required: [type, name, path]
      properties:
        type:
          const: saveDirectory
        name:
          type: string
          description: Display name. Empty falls back to the path's basename.
        path:
          type: string
          description: Filesystem path; a leading `~` is expanded host-side.
        previousPath:
          type: string
          description: Path of the entry being edited. Absent when adding.

    RemoveDirectory:
      description: >-
        Delete a user-defined Directory. Agents already running in it are left
        untouched.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeDirectory
        path:
          type: string

    SaveWorkspace:
      description: |
        Add or edit a Workspace. `id` identifies the Workspace being
        edited; absent means this is a new one and the host assigns the id. On
        success the host rebroadcasts `workspacesLoaded`; on failure it replies
        `workspaceRejected` and persists nothing.
      type: object
      additionalProperties: false
      required: [type, name, directoryPaths]
      properties:
        type:
          const: saveWorkspace
        id:
          type: string
          description: Id of the Workspace being edited. Absent when adding.
        name:
          type: string
          description: Display name of the Workspace.
        directoryPaths:
          type: array
          description: Paths of the Directories the Workspace contains.
          items:
            type: string

    RemoveWorkspace:
      description: >-
        Delete a Workspace. Its Directories and agents return to the
        default Workspace. The default Workspace cannot be removed.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: removeWorkspace
        id:
          type: string

    SetWorkspaceCurator:
      description: >-
        Standalone only. Appoint `agentId` as the curator of
        `workspaceId`. The agent must be one this host launched in a terminal
        (and still holds) in that Workspace, and the Workspace must have no
        curator yet. On success the
        host broadcasts `workspaceCuratorChanged`; otherwise it replies
        `curatorRejected`. In a non-default Workspace a success also records the KB Writer
        binding (`curatorBindingChanged`); if it cannot be saved, the
        appointment stands and the requester alone gets a `workspaceRejected`
        (it will not be restored after a restart).
      type: object
      additionalProperties: false
      required: [type, workspaceId, agentId]
      properties:
        type:
          const: setWorkspaceCurator
        workspaceId:
          type: string
        agentId:
          type: integer

    SetWorkspaceRoot:
      description: >-
        Standalone only. Set (a string) or clear (null) the root
        directory of `workspaceId`. While a Workspace has a root, its
        Knowledge Base `<root>/.note/` may be written only by its curator, and
        the personal Knowledge Base and configuration write rules apply to
        its agents. The root must be an absolute path to an existing directory;
        the host stores its realpath. Refused when `<root>/.note/` would equal,
        contain or be contained in a Directory's `<Directory>/.note/`. On
        success the host rebroadcasts `workspacesLoaded`; on failure it replies
        `workspaceRejected`.
      type: object
      additionalProperties: false
      required: [type, workspaceId, rootPath]
      properties:
        type:
          const: setWorkspaceRoot
        workspaceId:
          type: string
        rootPath:
          type: [string, 'null']

    SetWorkspacePermissionRoles:
      description: >-
        Standalone only. Set (an array) or clear (null) the default
        permission roles of `workspaceId`. R allows reading, E editing, D
        deleting; they are independent switches, and an empty array turns all
        three off. Without a default (null) agents launched in the Workspace
        have no roles, which allows everything. Only agents launched after the
        change use the new default. On success the host rebroadcasts
        `workspacesLoaded`; on failure it replies `workspaceRejected`.
      type: object
      additionalProperties: false
      required: [type, workspaceId, roles]
      properties:
        type:
          const: setWorkspacePermissionRoles
        workspaceId:
          type: string
        roles:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionRole'

    PermissionRole:
      description: >-
        A permission role: R (read), E (edit) or D (delete).
      type: string
      enum: [R, E, D]

    AgentGuardStatus:
      description: >-
        Standalone only (an embedded VS Code host never sends it), one per
        agent, broadcast to every connected office.
        Reports whether the write-guard rules really apply to the agent: the
        evidence is that the hook chain delivered a verdict request for the
        agent's current session, not the settings. `active` is false while any
        chain reason is listed (`not_standalone_agent`, `hooks_not_installed`,
        `pretooluse_hook_missing`, `hook_script_missing`,
        `awaiting_first_verdict`). `no_workspace_root` and `no_curator` are
        listed for display and do not change `active`. `permissionRoles` is
        the roles snapshotted when the agent launched (null: no roles, which
        allows everything). Sent when an agent is added, after
        `existingAgents` in the handshake, and whenever the content changes;
        an identical status is never resent. Carries no paths or tokens.
      type: object
      additionalProperties: false
      required: [type, id, active, reasons, permissionRoles]
      properties:
        type:
          const: agentGuardStatus
        id:
          type: integer
        active:
          type: boolean
        reasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GuardInactiveReason'
        permissionRoles:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionRole'

    GuardInactiveReason:
      description: >-
        Why the write-guard rules are weakened or off for an agent.
      type: string
      enum:
        - not_standalone_agent
        - hooks_not_installed
        - pretooluse_hook_missing
        - hook_script_missing
        - awaiting_first_verdict
        - no_workspace_root
        - no_curator

    UnsetWorkspaceCurator:
      description: >-
        Standalone only. Dismiss the curator of `workspaceId` and
        remove its KB Writer binding. On success the host broadcasts
        `workspaceCuratorChanged` with `agentId` null (also when the slot was
        already vacant but a binding existed) and, when a binding was removed,
        `curatorBindingChanged` with `directoryPath` null; a Workspace with
        neither a curator nor a binding is refused with `curatorRejected` code
        `invalid`. If the removal cannot be saved, the requester alone also
        gets a `workspaceRejected` (the binding may come back after a restart).
      type: object
      additionalProperties: false
      required: [type, workspaceId]
      properties:
        type:
          const: unsetWorkspaceCurator
        workspaceId:
          type: string

    RequestRoles:
      description: >-
        Standalone only. List the Roles in a registered Directory's
        `.claude/roles/`. Replied to this client only with `rolesAvailable`, or
        `roleRejected`.
      type: object
      additionalProperties: false
      required: [type, directoryPath]
      properties:
        type:
          const: requestRoles
        directoryPath:
          type: string
          description: Path of a registered Directory.

    RequestRolePreview:
      description: >-
        Standalone only. Read one listed Role for review. Replied
        to this client only with `rolePreview`, or `roleRejected`.
      type: object
      additionalProperties: false
      required: [type, directoryPath, roleId]
      properties:
        type:
          const: requestRolePreview
        directoryPath:
          type: string
        roleId:
          $ref: '#/components/schemas/RoleId'

    ConfirmRole:
      description: >-
        Standalone only. Trust the Role content the operator just
        reviewed. `sha256` is the hash from that `rolePreview`; the host
        re-reads the file and records the trust only when the hash still
        matches, replying `roleConfirmed` -- otherwise `roleRejected` (code
        `untrusted` when the file changed since the preview).
      type: object
      additionalProperties: false
      required: [type, directoryPath, roleId, sha256]
      properties:
        type:
          const: confirmRole
        directoryPath:
          type: string
        roleId:
          $ref: '#/components/schemas/RoleId'
        sha256:
          $ref: '#/components/schemas/RoleSha256'

    ListKbFiles:
      description: >-
        List the text files in an agent's personal KB or a
        Workspace KB. Replied to this client only with `kbFilesListed`, or
        `kbRejected`.
      type: object
      additionalProperties: false
      required: [type, target]
      properties:
        type:
          const: listKbFiles
        target:
          $ref: '#/components/schemas/KbTarget'

    ReadKbFile:
      description: >-
        Read one KB file, named by its path relative to the KB
        root exactly as `kbFilesListed` gave it. Replied to this client only
        with `kbFileRead`, or `kbRejected`.
      type: object
      additionalProperties: false
      required: [type, target, relPath]
      properties:
        type:
          const: readKbFile
        target:
          $ref: '#/components/schemas/KbTarget'
        relPath:
          $ref: '#/components/schemas/KbRelPath'

    RequestDirectorySuggestions:
      description: >-
        Ask the host for tappable path suggestions for the Directory modal; it
        replies `directorySuggestions` to this client only. Sent when the modal
        opens, so the list reflects the sessions on disk right then.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDirectorySuggestions

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    Directory:
      description: |
        A named filesystem location agents can be launched into. `source` marks
        where the entry came from: `host` entries are contributed by the host
        (VS Code's workspace folders, standalone's start directory) and are
        read-only in the office; `user` entries are defined by the user.
      type: object
      additionalProperties: false
      required: [name, path, source]
      properties:
        name:
          type: string
        path:
          type: string
        source:
          $ref: '#/components/schemas/DirectorySource'

    Workspace:
      description: |
        A named group of Directories. Agents launched in or resolved to one of
        its Directories belong to it.
      type: object
      additionalProperties: false
      required: [id, name, directoryPaths]
      properties:
        id:
          type: string
        name:
          type: string
        directoryPaths:
          type: array
          items:
            type: string
        rootPath:
          type: string
          description: >-
            Realpath of the Workspace root directory. Absent: no root, and the
            Knowledge Base write rules are off for this Workspace.
        permissionRoles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionRole'
          description: >-
            Default permission roles for agents launched in this Workspace
            (snapshotted at launch). Absent: no default, so agents have no
            roles unless the launch names some. Empty: all roles off.

    RoleId:
      description: >-
        A Role's id: its file name in `<Directory>/.claude/roles/`, ASCII only,
        ending in `.md` (for example `frontend.md`). Never a path. Windows
        reserved device names are refused host-side as well.
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}\.md$'
      maxLength: 67

    RoleName:
      description: >-
        A Role's display name: its id without the `.md` suffix. Shown on agent
        cards to every office (the same exposure as a Directory name); never
        the Role's content or hash.
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      maxLength: 64

    RoleSha256:
      description: Lowercase hex SHA-256 of the Role file's raw bytes.
      type: string
      pattern: '^[0-9a-f]{64}$'

    RoleEntry:
      description: One Role listed by `rolesAvailable`.
      type: object
      additionalProperties: false
      required: [roleId, name]
      properties:
        roleId:
          $ref: '#/components/schemas/RoleId'
        name:
          $ref: '#/components/schemas/RoleName'

    RoleRejectionCode:
      description: |
        Why a Role request was refused:
        - `untrusted`: this content is not (or no longer) confirmed; preview and
          confirm it again.
        - `invalid`: a field failed validation, the Directory is not registered,
          or the Role is not listed there / its content is not acceptable.
        - `unavailable`: Roles are not supported on this host or in this mode
          (VS Code panel, no terminal, Windows).
        - `io`: the host could not read or write its own Role storage.
      type: string
      enum: [untrusted, invalid, unavailable, io]

    KbTarget:
      description: |
        Which KB a request names: an agent's personal KB (by agent id) or a
        Workspace KB (by Workspace id). One shape per scope, so the id's type
        always matches its scope.
      oneOf:
        - $ref: '#/components/schemas/AgentKbTarget'
        - $ref: '#/components/schemas/WorkspaceKbTarget'
      discriminator: scope

    AgentKbTarget:
      description: >-
        An agent's personal KB: `<the agent's Directory>/.note/<identity key>/`,
        where the key is the agent's Role id (or the reserved key when it has
        no Role). Only agents this host launched in a terminal have one.
      type: object
      additionalProperties: false
      required: [scope, agentId]
      properties:
        scope:
          const: agent
        agentId:
          type: integer

    WorkspaceKbTarget:
      description: "A Workspace KB: `<the Workspace's root>/.note/`."
      type: object
      additionalProperties: false
      required: [scope, workspaceId]
      properties:
        scope:
          const: workspace
        workspaceId:
          type: string
          maxLength: 100

    KbRelPath:
      description: >-
        A file's path relative to the KB root, `/`-separated (never `\`),
        never absolute, with no empty, `.`, `..` or `.`-prefixed segment, at
        most 8 segments and 1024 characters, ending in `.md` or `.txt`.
      type: string
      maxLength: 1024

    KbFileEntry:
      description: One file listed by `kbFilesListed`.
      type: object
      additionalProperties: false
      required: [path, size]
      properties:
        path:
          $ref: '#/components/schemas/KbRelPath'
        size:
          type: integer
          description: File size in bytes.

    KbRejectionReason:
      description: |
        Why a KB request was refused:
        - `not_found`: no such agent, Workspace, KB or file (or a malformed
          target).
        - `too_large`: the file is larger than the read cap (64 KiB).
        - `not_text`: the file's extension is not allowlisted, or its content
          is not acceptable text.
        - `unsafe`: the path is malformed or escapes the KB, or something on
          the way is a symlink, hard link, FIFO or other non-plain entry, or
          changed while it was being read.
        - `unavailable`: KB browsing is not possible here (the agent has no
          Directory or identity key, the Workspace has no root, an unsupported
          platform, too many requests at once, or a host read error).
      type: string
      enum: [not_found, too_large, not_text, unsafe, unavailable]

    CuratorEntry:
      description: One Workspace's curator.
      type: object
      additionalProperties: false
      required: [workspaceId, agentId]
      properties:
        workspaceId:
          type: string
        agentId:
          type: integer

    CuratorBinding:
      description: >-
        One Workspace's KB Writer binding: the realpath of the Directory its
        appointed agent was launched in. Never the default Workspace.
      type: object
      additionalProperties: false
      required: [workspaceId, directoryPath]
      properties:
        workspaceId:
          type: string
        directoryPath:
          type: string

    CuratorRejectionCode:
      description: |
        Why a curator request was refused:
        - `invalid`: a field failed validation, the Workspace does not exist,
          or (dismissing) the Workspace has no curator.
        - `exists`: the Workspace already has a curator.
        - `not_eligible`: the agent is not one this host launched in a
          terminal into that Workspace (or its terminal is gone).
        - `unavailable`: curators are not supported on this host or in this
          mode (VS Code panel, embedded server).
      type: string
      enum: [invalid, exists, not_eligible, unavailable]

    DirectorySource:
      description: |
        Where a Directory came from. `host` entries are contributed by the host
        and are read-only in the office; `user` entries are defined by the user.
      type: string
      enum: [user, host]

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
